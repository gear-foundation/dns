name: Build and Deploy DNS

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: Target environment
        required: false
        options: [prod]
      deploy_indexer:
        type: boolean
        description: Build indexer
        default: true
      deploy_explorer:
        type: boolean
        description: Build explorer
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: write
  id-token: write

jobs:
  deploy:
    uses: gear-ops/actions/.github/workflows/build-deploy.yaml@main
    with:
      app: dns
      env: ${{ inputs.env }}
      components: |
        - name: indexer
          docker_context: indexer
          docker_file: Dockerfile-indexer
          paths: indexer/**
        - name: explorer
          docker_context: api
          paths: api/**
    secrets:
      CHARTS_REPO_TOKEN: ${{ secrets.CHARTS_REPO_TOKEN }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
